version: "3.9"

services:

  backend:
    build:
      context: ./backend-iris
      dockerfile: Dockerfile
    container_name: iris-backend
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LOG_LEVEL=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-iris
      dockerfile: Dockerfile
    container_name: iris-frontend
    ports:
      - "7860:7860"
    environment:
      # CLAVE: En la red interna, busca al backend por su nombre de servicio
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        # Esto garantiza que el frontend no arranque hasta que el backend devuelva HTTP 200
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: iris-network
    driver: bridge
